name: Runner Probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-15, macos-15-intel, macos-15-arm64, macos-14-arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Show runner
        run: |
          uname -m
          sw_vers