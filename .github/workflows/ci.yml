name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Standard GitHub-hosted macOS runners are Intel (x64). The release build is
    # cross-published for arm64; tests run natively on x64 to avoid mixed-arch
    # test hosts. Real game/Wine integration tests are excluded.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore app (arm64)
        run: >
          dotnet restore src/XIVLauncher.Avalonia/XIVLauncher.Avalonia.csproj
          -p:RuntimeIdentifier=osx-arm64

      - name: Build app (arm64)
        run: >
          dotnet build src/XIVLauncher.Avalonia/XIVLauncher.Avalonia.csproj
          -c Release -p:RuntimeIdentifier=osx-arm64 --no-restore

      - name: Restore tests (x64)
        run: >
          dotnet restore src/XIVLauncher.Test/XIVLauncher.Test.csproj
          -p:RuntimeIdentifier=osx-x64

      - name: Build tests (x64)
        run: >
          dotnet build src/XIVLauncher.Test/XIVLauncher.Test.csproj
          -c Release -p:RuntimeIdentifier=osx-x64 --no-restore

      - name: Unit tests
        run: >
          dotnet test src/XIVLauncher.Test/XIVLauncher.Test.csproj
          -c Release -p:RuntimeIdentifier=osx-x64 --no-build
          --logger "trx;LogFileName=test-results.trx"
          --filter "FullyQualifiedName!~MaintenanceIntegrationTests"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore